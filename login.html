<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Studizz1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <nav class="nav">
    <a class="brand" href="index.html">Studizz1</a>
    <a href="index.html">Studio</a>
    <a href="index.html#rooms">Rooms</a>
    <a href="gigs.html">Events</a>
  </nav>

  <header class="top">
    <h1>Log in</h1>
    <p>You need an account to book a room.</p>
  </header>

  <main class="stack">
    <section class="authbox" aria-label="Account">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">Sign up</button>
      </div>

      <form class="box" id="login-form" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <p class="error" id="login-error" role="alert"></p>
        <button type="submit" class="primary">Log in</button>
      </form>

      <form class="box" id="register-form" novalidate hidden>
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" autocomplete="name" maxlength="80" required>
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" required>
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <p class="hint">At least 8 characters, with a letter and a number.</p>
        <p class="error" id="register-error" role="alert"></p>
        <button type="submit" class="primary">Create account</button>
      </form>
      <p class="hint" style="margin-top:1rem">Create an account with your email address. If email confirmation is enabled, confirm your address before logging in.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
